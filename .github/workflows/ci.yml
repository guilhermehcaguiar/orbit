name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orbit_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: orbit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      ORBIT_TEST_DATABASE_URL: postgresql://orbit_runtime:orbit_runtime@127.0.0.1:5432/orbit_ci
      MIGRATION_URL: postgresql://postgres:orbit_ci@127.0.0.1:5432/orbit_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:deploy
      - run: npm run test
      - run: npm run db:check --workspace @orbit/api
      - name: Aplicar migrations e preparar o papel de runtime
        run: |
          DATABASE_URL="$MIGRATION_URL" npm run db:migrate --workspace @orbit/api
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE orbit_runtime LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'orbit_runtime'"
          psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -v orbit_runtime=orbit_runtime -f apps/api/drizzle/runtime-grants.sql
      - run: npm run test:integration --workspace @orbit/api
      - run: npm exec --workspace @orbit/web -- playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @orbit/web
